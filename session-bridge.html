<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Gatita account</title>
<script data-cfasync="false">
  (async () => {
    let token = '';
    try {
      token = localStorage.getItem('gatita_ask_token') || localStorage.getItem('cl4nkr_ask_token') || '';
    } catch (_) {}
    try {
      const response = await fetch('https://api.gatita.tech/ask-api/me', {
        credentials: 'include',
        headers: token ? { Authorization: `Bearer ${token}` } : {}
      });
      if (!response.ok) throw new Error('Account unavailable');
      const { user } = await response.json();
      parent.postMessage({ type: 'gatita-account', user: user ? {
        id: user.id, displayName: user.displayName, email: user.email, emailVerified: user.emailVerified
      } : null }, 'https://search.gatita.tech');
    } catch (_) {
      parent.postMessage({ type: 'gatita-account', error: true }, 'https://search.gatita.tech');
    }
  })();
</script>
</html>
