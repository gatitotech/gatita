<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatita Ask</title>
    <meta name="description" content="Gatita Ask chat interface.">
    <meta name="theme-color" content="#542d14">
    <link rel="canonical" href="https://ask.clankr.tech/">
    <link rel="icon" href="assets/avatar.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="smoke-layer" aria-hidden="true"></div>

    <main class="ask-app">
        <aside class="chat-sidebar" aria-label="Chats">
            <div class="side-head">
                <a class="brand" href="https://ask.clankr.tech/" aria-label="Gatita Ask home">
                    <img src="assets/avatar.webp" alt="" width="36" height="36">
                    <span>Gatita Ask</span>
                </a>
                <button class="icon-btn" id="newChatButton" type="button" aria-label="New chat" title="New chat">
                    <i data-lucide="plus"></i>
                </button>
            </div>

            <div class="account-strip">
                <div>
                    <span class="account-name" id="accountName">Guest</span>
                    <span class="usage-text" id="usageText">Loading...</span>
                </div>
                <button class="small-btn" id="accountButton" type="button">Account</button>
            </div>

            <nav class="chat-list" id="chatList" aria-label="Saved chats"></nav>
        </aside>

        <section class="chat-main" aria-label="Gatita Ask chat">
            <header class="chat-topbar">
                <div class="topbar-inner">
                    <div class="mode-summary">
                        <span class="mode-label">Current setup</span>
                        <span id="settingsSummary">Loading...</span>
                    </div>
                    <div class="settings-wrap">
                        <button class="settings-button" id="settingsButton" type="button" aria-expanded="false" aria-controls="settingsMenu">
                            <i data-lucide="sliders-horizontal"></i>
                            <span>Settings</span>
                        </button>
                        <div class="settings-menu hidden" id="settingsMenu">
                            <label class="select-shell">
                                <span>Model</span>
                                <select id="modelSelect"></select>
                            </label>
                            <label class="select-shell">
                                <span>Personality</span>
                                <select id="personalitySelect"></select>
                            </label>
                            <label class="thinking-toggle">
                                <input id="thinkingToggle" type="checkbox">
                                <span class="toggle-track"></span>
                                <span>Thinking</span>
                            </label>
                            <label class="thinking-toggle research-control" title="Research is available for signed-in accounts">
                                <input id="researchToggle" type="checkbox">
                                <span class="toggle-track"></span>
                                <span>Research</span>
                            </label>
                            <label class="thinking-toggle research-control" title="Deep research is available for signed-in accounts">
                                <input id="deepResearchToggle" type="checkbox">
                                <span class="toggle-track"></span>
                                <span>Deep research</span>
                            </label>
                        </div>
                    </div>
                </div>
            </header>

            <div class="message-scroll" id="messageScroll">
                <div class="empty-state" id="emptyState">
                    <img src="assets/avatar.webp" alt="" width="84" height="84">
                    <h1>Gatita Ask</h1>
                </div>
                <div class="messages" id="messages"></div>
            </div>

            <section class="composer-zone" aria-label="Message composer">
                <div class="attachment-row" id="attachmentRow"></div>
                <form class="composer" id="composer">
                    <button class="icon-btn attach-btn" id="attachButton" type="button" aria-label="Attach files" title="Attach files">
                        <i data-lucide="paperclip"></i>
                    </button>
                    <input id="fileInput" type="file" multiple hidden>
                    <textarea id="messageInput" rows="1" placeholder="Ask anything"></textarea>
                    <button class="send-btn" id="sendButton" type="submit">
                        <i data-lucide="send-horizontal"></i>
                        <span>Send</span>
                    </button>
                </form>
                <div class="verify-row">
                    <div class="turnstile-box" id="turnstileBox"></div>
                    <p>Gatita Ask is in beta and may create biased or incorrect information. Verify critical facts.</p>
                </div>
            </section>
        </section>
    </main>

    <div class="modal-backdrop hidden" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <section class="auth-modal">
            <div class="modal-head">
                <h2 id="authTitle">Account</h2>
                <button class="icon-btn" id="closeAuthButton" type="button" aria-label="Close">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <div class="auth-tabs" role="tablist">
                <button class="auth-tab active" type="button" data-auth-mode="login">Sign in</button>
                <button class="auth-tab" type="button" data-auth-mode="register">Create account</button>
            </div>

            <form class="auth-form" id="authForm">
                <label>
                    <span>Email</span>
                    <input id="authEmail" type="email" autocomplete="email" required>
                </label>
                <label class="register-only hidden">
                    <span>Display name</span>
                    <input id="authDisplayName" type="text" autocomplete="nickname" maxlength="40">
                </label>
                <label>
                    <span>Password</span>
                    <input id="authPassword" type="password" autocomplete="current-password" required minlength="8">
                </label>
                <div class="turnstile-box auth-turnstile" id="authTurnstileBox"></div>
                <p class="form-error" id="authError" role="alert"></p>
                <button class="auth-submit" type="submit">Continue</button>
            </form>
        </section>
    </div>

    <div class="modal-backdrop hidden" id="accountModal" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
        <section class="auth-modal account-window">
            <div class="modal-head">
                <h2 id="accountTitle">Account</h2>
                <button class="icon-btn" id="closeAccountButton" type="button" aria-label="Close">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <div class="account-body">
                <div class="account-card">
                    <span class="account-label">Signed in as</span>
                    <strong id="accountModalName">Account</strong>
                    <span id="accountModalEmail"></span>
                </div>

                <div class="rate-grid">
                    <div class="rate-card">
                        <span class="account-label">Messages</span>
                        <strong id="accountMinuteLimit">-</strong>
                        <span>Per-minute limit</span>
                    </div>
                    <div class="rate-card">
                        <span class="account-label">Deep research</span>
                        <strong id="accountDeepLimit">-</strong>
                        <span>Daily allowance</span>
                    </div>
                </div>

                <div class="account-actions">
                    <button class="small-btn" id="accountSignOutButton" type="button">Sign out</button>
                </div>
            </div>
        </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            startup: {
                typeset: false
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" defer></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
