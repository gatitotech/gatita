<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>Gatita Login</title>
    <meta name="theme-color" content="#050505" />
    <link rel="canonical" href="https://gatita.tech/login.html" />
    <link rel="icon" href="assets/avatar.webp" type="image/webp" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --panel: rgba(22, 16, 12, 0.92);
        --line: rgba(255, 255, 255, 0.1);
        --line-strong: rgba(255, 255, 255, 0.16);
        --line-accent: rgba(255, 102, 0, 0.4);
        --text: #fff;
        --muted: #b4b0ab;
        --accent: #ff6600;
        --accent-strong: #cc5200;
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 18% 18%, rgba(255,102,0,.2), transparent 30%),
          radial-gradient(circle at 82% 14%, rgba(143,174,154,.14), transparent 30%),
          radial-gradient(circle at 55% 115%, rgba(255,102,0,.07), transparent 40%),
          linear-gradient(180deg, #040404, #0b0b0b 60%, #050505);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: min(520px, 100%);
        padding: 30px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background:
          linear-gradient(180deg, rgba(255,255,255,.03), transparent 120px),
          var(--panel);
        box-shadow: 0 30px 90px rgba(0,0,0,.55);
        animation: rise-in 420ms var(--ease-spring) backwards;
      }
      body:not(.app-ready) .card { animation: none; }
      @keyframes rise-in {
        from { opacity: 0; transform: translateY(14px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
      .brand img {
        width: 44px;
        height: 44px;
        border: 1px solid var(--line-accent);
        border-radius: 14px;
        box-shadow: 0 0 24px rgba(255,102,0,.22);
      }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.03em; }
      p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; }
      a, button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        appearance: none;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        text-decoration: none;
        transition: transform 150ms var(--ease-spring), filter 150ms ease, background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
      }
      a:active, button:active { transform: scale(0.96); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #1a0c02;
        font-weight: 750;
        box-shadow: 0 8px 26px rgba(255,102,0,.28);
      }
      .primary:hover { filter: brightness(1.08); }
      .secondary {
        background: rgba(255,255,255,.05);
        color: var(--text);
        border: 1px solid var(--line-strong);
      }
      .secondary:hover { background: rgba(255,255,255,.09); }
      .small { font-size: 14px; color: var(--muted); margin-top: 18px; }
      .status {
        margin-top: 20px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255,255,255,.03);
        font-size: 14px;
        color: var(--muted);
      }
      .preloader {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 40%, rgba(255,102,0,.1), transparent 44%),
          linear-gradient(180deg, #040404, #0a0a0a 55%, #050505);
        opacity: 1;
        visibility: visible;
        transition: opacity 480ms var(--ease-spring), visibility 480ms;
        will-change: opacity;
      }
      .preloader-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .preloader-core { display: flex; flex-direction: column; align-items: center; gap: 24px; }
      .preloader-logo { position: relative; width: 96px; height: 96px; }
      .preloader-logo img {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        border: 1px solid var(--line-accent);
        border-radius: 24px;
        box-shadow: 0 0 64px rgba(255,102,0,.35), 0 26px 60px rgba(0,0,0,.5);
        animation: preloader-logo-in 640ms var(--ease-spring) both;
      }
      .preloader-ring {
        position: absolute;
        inset: -16px;
        z-index: 1;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0%, rgba(255,102,0,.9) 12%, rgba(255,133,51,.35) 26%, transparent 38%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        opacity: 0;
        animation: ring-spin 1.4s linear .3s infinite, ring-fade 520ms var(--ease-spring) .3s both;
      }
      .preloader-pulse {
        position: absolute;
        inset: 0;
        z-index: 0;
        border: 1px solid rgba(255,102,0,.55);
        border-radius: 24px;
        animation: preloader-pulse 1.9s var(--ease-spring) infinite;
      }
      .preloader-word {
        font-size: .92rem;
        font-weight: 750;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0;
        animation: word-in 560ms var(--ease-spring) .35s both;
      }
      @keyframes preloader-logo-in {
        from { opacity: 0; transform: scale(.82) translateY(12px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes ring-spin { to { transform: rotate(360deg); } }
      @keyframes ring-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes preloader-pulse {
        0% { opacity: 0; transform: scale(.92); }
        40% { opacity: .7; }
        100% { opacity: 0; transform: scale(1.5); }
      }
      @keyframes word-in {
        from { opacity: 0; transform: translateY(10px); letter-spacing: .22em; }
        to { opacity: 1; transform: translateY(0); letter-spacing: .16em; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="preloader" id="preloader" aria-hidden="true">
      <div class="preloader-core">
        <div class="preloader-logo">
          <img src="assets/avatar.webp" alt="" width="96" height="96" />
          <span class="preloader-ring" aria-hidden="true"></span>
          <span class="preloader-pulse" aria-hidden="true"></span>
        </div>
        <span class="preloader-word">Gatita</span>
      </div>
    </div>
    <main class="card">
      <div class="brand">
        <img src="assets/avatar.webp" alt="" width="42" height="42" />
        <div>
          <h1>Sign in to Gatita</h1>
          <p>Use the same account that powers the main site and the API dashboard.</p>
        </div>
      </div>
      <div class="actions">
        <a class="primary" id="continueLink" href="/index.html?login=1&redirect=/api.html">Continue to login</a>
        <a class="secondary" href="/index.html">Back to home</a>
      </div>
      <div class="status" id="statusText">Checking your session...</div>
      <div class="small">If you are already signed in on the main site, this page will forward you automatically.</div>
    </main>
    <script>
      (function () {
        const STORAGE_PREFIX = 'gatita_ask_';
        const LEGACY_STORAGE_PREFIX = ['cl4', 'nkr_ask_'].join('');
        const params = new URLSearchParams(window.location.search);
        const redirect = (params.get('redirect') || '/api.html').trim();
        const safeRedirect = redirect.startsWith('/') && !redirect.startsWith('//') ? redirect : '/api.html';
        const token = localStorage.getItem(`${STORAGE_PREFIX}token`) || localStorage.getItem(`${LEGACY_STORAGE_PREFIX}token`) || '';
        const continueLink = document.getElementById('continueLink');
        continueLink.href = `/index.html?login=1&redirect=${encodeURIComponent(safeRedirect)}`;
        if (token) {
          document.getElementById('statusText').textContent = 'Session found. Redirecting to the dashboard.';
          window.location.replace(safeRedirect);
          return;
        }
        document.getElementById('statusText').textContent = 'No session found. Open the sign-in form.';
      })();
    </script>
    <script>
      (function () {
        var preloader = document.getElementById("preloader");
        if (!preloader) return;
        var hide = function () {
          document.body.classList.add("app-ready");
          preloader.classList.add("preloader-done");
        };
        var t0 = performance.now();
        var onLoad = function () {
          var wait = Math.max(0, 750 - (performance.now() - t0));
          window.setTimeout(hide, wait);
        };
        if (document.readyState === "complete") onLoad();
        else window.addEventListener("load", onLoad);
        window.setTimeout(hide, 3500);
      })();
    </script>
  </body>
</html>
