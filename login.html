<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>Gatita Login</title>
    <meta name="theme-color" content="#050505" />
    <link rel="canonical" href="https://gatita.tech/login.html" />
    <link rel="icon" href="assets/avatar.webp" type="image/webp" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --panel: rgba(22, 14, 10, 0.9);
        --line: rgba(255, 255, 255, 0.1);
        --text: #fff;
        --muted: #b8b8b8;
        --accent: #ff6600;
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(255,102,0,.18), transparent 28%),
          radial-gradient(circle at 80% 15%, rgba(143,174,154,.12), transparent 30%),
          linear-gradient(180deg, #040404, #0b0b0b 60%, #050505);
        color: var(--text);
      }
      .card {
        width: min(520px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0,0,0,.45);
      }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
      .brand img { width: 42px; height: 42px; border-radius: 12px; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; }
      a, button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        font: inherit;
        cursor: pointer;
        text-decoration: none;
      }
      .primary { background: var(--accent); color: #140900; font-weight: 700; }
      .secondary { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--line); }
      .small { font-size: 14px; color: var(--muted); margin-top: 16px; }
      .status { margin-top: 18px; font-size: 14px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <img src="assets/avatar.webp" alt="" width="42" height="42" />
        <div>
          <h1>Sign in to Gatita</h1>
          <p>Use the same account that powers the main site and the API dashboard.</p>
        </div>
      </div>
      <div class="actions">
        <a class="primary" id="continueLink" href="/index.html?login=1&redirect=/api.html">Continue to login</a>
        <a class="secondary" href="/index.html">Back to home</a>
      </div>
      <div class="status" id="statusText">Checking your session...</div>
      <div class="small">If you are already signed in on the main site, this page will forward you automatically.</div>
    </main>
    <script>
      (function () {
        const STORAGE_PREFIX = 'gatita_ask_';
        const LEGACY_STORAGE_PREFIX = ['cl4', 'nkr_ask_'].join('');
        const params = new URLSearchParams(window.location.search);
        const redirect = (params.get('redirect') || '/api.html').trim();
        const safeRedirect = redirect.startsWith('/') && !redirect.startsWith('//') ? redirect : '/api.html';
        const token = localStorage.getItem(`${STORAGE_PREFIX}token`) || localStorage.getItem(`${LEGACY_STORAGE_PREFIX}token`) || '';
        const continueLink = document.getElementById('continueLink');
        continueLink.href = `/index.html?login=1&redirect=${encodeURIComponent(safeRedirect)}`;
        if (token) {
          document.getElementById('statusText').textContent = 'Session found. Redirecting to the dashboard.';
          window.location.replace(safeRedirect);
          return;
        }
        document.getElementById('statusText').textContent = 'No session found. Open the sign-in form.';
      })();
    </script>
  </body>
</html>
