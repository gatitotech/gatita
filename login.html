<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title data-i18n="Sign in to Gatita"></title>
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://gatita.tech/login.html" />
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20261007h" />
    <script src="i18n.js?v=20261006a"></script>
  </head>
  <body>
    <div class="preloader" id="preloader" aria-hidden="true">
      <div class="preloader-core">
        <div class="preloader-logo">
          <img src="assets/avatar.webp" alt="" width="84" height="84" />
          <span class="preloader-sheen" aria-hidden="true"></span>
        </div>
      </div>
    </div>

    <main class="center-stage">
      <section class="center-card">
        <div class="brand">
          <img src="assets/avatar.webp" alt="" width="46" height="46" />
          <span data-i18n="Gatita Ask"></span>
        </div>

        <h1 data-i18n="Sign in to Gatita"></h1>
        <p data-i18n="The same account powers Gatita Ask and the API dashboard. We forward you to the sign-in form and bring you straight back."></p>

        <div class="row">
          <a class="btn btn-primary btn-lg" id="continueLink" href="/index.html?login=1" data-i18n="Continue to login"></a>
          <a class="btn btn-lg" href="/index.html" data-i18n="Back to home"></a>
        </div>

        <div class="status" id="statusText" data-i18n="Checking your session…"></div>

        <p class="fineprint" data-i18n="Sessions live in this browser. Signing out clears the token locally."></p>
      </section>
    </main>

    <script>
      (function () {
        var STORAGE_PREFIX = "gatita_ask_";
        var LEGACY_STORAGE_PREFIX = ["cl4", "nkr_ask_"].join("");
        var params = new URLSearchParams(window.location.search);
        var redirect = (params.get("redirect") || "/index.html").trim();
        var safeRedirect =
          redirect.startsWith("/") && !redirect.startsWith("//")
            ? redirect
            : "/index.html";

        var token =
          localStorage.getItem(STORAGE_PREFIX + "token") ||
          localStorage.getItem(LEGACY_STORAGE_PREFIX + "token") ||
          "";

        var link = document.getElementById("continueLink");
        link.href =
          "/index.html?login=1&redirect=" + encodeURIComponent(safeRedirect);

        var status = document.getElementById("statusText");
        if (token) {
          status.textContent = "Session found. Redirecting…";
          window.location.replace(safeRedirect);
        } else {
          status.textContent = "No session in this browser. Open the sign-in form.";
        }
      })();
    </script>
    <script src="loader.js?v=20261006a"></script>
  </body>
</html>
